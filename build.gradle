plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'org.hope'
version = '1.3'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url 'https://jitpack.io' }
    maven {
        url 'https://repo.xenondevs.xyz/releases'
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("com.github.GriefPrevention:GriefPrevention:18.0.0")
    implementation("xyz.xenondevs.invui:invui:2.0.0-beta.5")
    implementation("org.bstats:bstats-bukkit:3.2.1")
}

shadowJar {
    configurations = [project.configurations.runtimeClasspath]

    dependencies {
        // Only include InvUI and bStats in the fat jar
        exclude { it.moduleGroup != "org.bstats" && it.moduleGroup != "xyz.xenondevs.invui" && it.moduleGroup != "org.jetbrains" && it.moduleGroup != "org.jspecify" }
    }

    // Relocate InvUI to prevent conflicts with other plugins
    relocate 'xyz.xenondevs.invui', 'org.hope.griefPreventionEasyGUI.libs.invui'

    // Relocate bStats to avoid conflicts with other plugins
    relocate 'org.bstats', "${project.group}.libs.bstats"
}

build.dependsOn shadowJar
jar.enabled = false

tasks {
    runServer {
        minecraftVersion("1.21.11")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
