name: GriefPreventionEasyGUI
version: '1.5'
main: org.hope.griefPreventionEasyGUI.GriefPreventionEasyGUI
api-version: '26.2'
depend: [GriefPrevention]

commands:
  claimhelp:
    description: Opens a grief prevention help GUI.
    usage: /claimhelp
  gpegui-reload:
    description: Reloads the GriefPreventionEasyGUI configuration.
    usage: /gpegui-reload
    permission: gpegui.admin
